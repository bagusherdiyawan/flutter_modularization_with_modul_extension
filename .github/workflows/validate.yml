name: Validate SmartPOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package in the action default is no longer available.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;26.3.11579264'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: python3 tool/check_deferred.py
      - run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Build Android on-demand bundle
        run: flutter build appbundle --release
      - name: Verify split payload and baseline
        run: |
          (cd android && ./gradlew :app:verifyDeferredManagerAbi)
          python3 tool/check_deferred.py --aab build/app/outputs/bundle/release/app-release.aab
          git diff --exit-code -- deferred_components_loading_units.yaml android/app/src/main/AndroidManifest.xml
      - name: Upload build and validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartpos-android
          if-no-files-found: warn
          path: |
            build/app/outputs/bundle/release/*.aab
            coverage/lcov.info
            deferred_components_loading_units.yaml
            build/android_deferred_components_setup_files/
