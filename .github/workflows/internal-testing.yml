name: Build Internal Testing AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SMARTPOS_REQUIRE_UPLOAD_SIGNING: 'true'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Prepare private upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          export SMARTPOS_KEYSTORE_PATH="$RUNNER_TEMP/smartpos-upload.jks"
          printf 'SMARTPOS_KEYSTORE_PATH=%s\n' "$SMARTPOS_KEYSTORE_PATH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub Secrets: ' + ', '.join(missing))
          path = Path(os.environ['SMARTPOS_KEYSTORE_PATH'])
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
          keytool -list -keystore "$SMARTPOS_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null
      - name: Install Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0' 'ndk;26.3.11579264'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build signed AAB
        run: flutter build appbundle --release --build-number=$((100 + GITHUB_RUN_NUMBER))
      - name: Verify splits and upload signature
        run: |
          python3 tool/check_deferred.py --aab build/app/outputs/bundle/release/app-release.aab
          git diff --exit-code -- deferred_components_loading_units.yaml android/app/src/main/AndroidManifest.xml
          keytool -exportcert -rfc -keystore "$SMARTPOS_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/upload-certificate.pem"
          python3 tool/verify_bundle_signing.py --bundle build/app/outputs/bundle/release/app-release.aab --certificate "$RUNNER_TEMP/upload-certificate.pem"
      - name: Upload Internal Testing bundle
        uses: actions/upload-artifact@v4
        with:
          name: smartpos-internal-testing-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/smartpos-upload.jks" "$RUNNER_TEMP/upload-certificate.pem"
