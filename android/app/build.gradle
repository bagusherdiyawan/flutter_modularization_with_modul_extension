plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}
def uploadStore = System.getenv('SMARTPOS_KEYSTORE_PATH')
def requireUploadSigning = System.getenv('SMARTPOS_REQUIRE_UPLOAD_SIGNING') == 'true'
def signingNames = ['ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
if (requireUploadSigning || uploadStore) {
    if (!uploadStore || !file(uploadStore).isFile() || signingNames.any { !System.getenv(it) }) {
        throw new GradleException('Upload signing configuration is incomplete. Check keystore path and signing secrets.')
    }
}
android {
    namespace 'com.pos.modularization'
    sourceSets.main.java.srcDir('src/main/modernPlay')
    compileSdk 36
    ndkVersion flutter.ndkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig {
        applicationId 'com.pos.modularization'
        minSdk 24
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    dynamicFeatures = [':pulsaComponent', ':edcComponent']
    signingConfigs {
        if (uploadStore) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Validation builds use debug signing; the Internal Testing workflow requires upload signing.
            signingConfig uploadStore ? signingConfigs.upload : signingConfigs.debug
        }
    }
}
flutter { source '../..' }
dependencies {
    implementation 'com.google.android.play:feature-delivery:2.1.0'
}

// Guard against linking the deferred adapter to the removed legacy Play Core Task ABI.
tasks.register('verifyDeferredManagerAbi') {
    dependsOn 'compileReleaseJavaWithJavac'
    doLast {
        def javaCompile = tasks.named('compileReleaseJavaWithJavac').get()
        def manager = new File(javaCompile.destinationDirectory.get().asFile,
            'com/pos/modularization/SmartPosDeferredComponentManager.class')
        if (!manager.isFile()) throw new GradleException('Modern deferred manager was not compiled.')
        def bytecode = new String(manager.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
        if (!bytecode.contains('com/google/android/gms/tasks/Task') ||
                bytecode.contains('com/google/android/play/core/tasks/')) {
            throw new GradleException('Deferred adapter uses an incompatible Play Tasks ABI.')
        }
        logger.lifecycle('PASS: deferred adapter uses the GMS Tasks ABI.')
    }
}
